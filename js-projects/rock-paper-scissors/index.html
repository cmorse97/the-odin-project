<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <h1>Rock, Paper, Scissors!</h1>
    <div id="game">
      <div id="scoreboard">
        <h3>Score</h3>
        <div class="scores">
          <div class="score-bug">
            <h4>User</h4>
            <p id="user-score"></p>
          </div>
          <div class="score-bug">
            <h4>Computer</h4>
            <p id="computer-score"></p>
          </div>
        </div>
      </div>
      <div id="game-controls">
        <button id="start-game-btn" class="block-btn">Start Game!</button>
        <div id="user-selection-btns" class="hidden">
          <button id="rock">Rock</button>
          <button id="paper">Paper</button>
          <button id="scissors">Scissors</button>
        </div>
        <button id="restart-game-btn" class="hidden block-btn">
          Play Again!
        </button>
      </div>
      <div id="round-selections" class="text-display"></div>
      <div id="round-result" class="text-display"></div>
    </div>
  </body>
</html>
