<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOP Project | Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <h1>Calculator</h1>
    <div id="calculator">
      <div id="calc-display">
        <p id="text-display">0</p>
      </div>
      <div id="calc-inputs">
        <div id="calc-digits">
          <input type="button" value="7" class="btn digit" />
          <input type="button" value="8" class="btn digit" />
          <input type="button" value="9" class="btn digit" />
          <input type="button" value="4" class="btn digit" />
          <input type="button" value="5" class="btn digit" />
          <input type="button" value="6" class="btn digit" />
          <input type="button" value="1" class="btn digit" />
          <input type="button" value="2" class="btn digit" />
          <input type="button" value="3" class="btn digit" />
          <input type="button" value="C" id="clear" class="btn" />
          <input type="button" value="0" class="btn digit zero" />
          <input type="button" value="=" id="equals" class="btn" />
        </div>
        <div id="calc-operators">
          <input type="button" value="/" id="divide" class="btn" />
          <input type="button" value="X" id="multiply" class="btn" />
          <input type="button" value="-" id="subtract" class="btn" />
          <input type="button" value="+" id="add" class="btn" />
        </div>
      </div>
    </div>
  </body>
</html>
