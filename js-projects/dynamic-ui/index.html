<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>TOP | Dynamic UI Interactions</title>
		<link rel="stylesheet" href="style.css" />
		<script type="module" src="app.js" defer></script>
	</head>
	<body>
		<header>
			<h1>Dynamic UI Interactions</h1>
		</header>
		<div id="app">
			<div class="dropdown-container">
				<h2>Dropdown menu</h2>
				<p>Click the button below to toggle a dropdown menu.</p>
				<div class="menu-btns">
					<button id="dropdown-menu-trigger" class="dropdown-btn">
						Click Me
					</button>
				</div>
				<menu id="dropdown-menu" class="hidden">
					<li><a href="#">Settings</a></li>
					<li><a href="#">Profile</a></li>
					<li><a href="#">Log Out</a></li>
				</menu>
			</div>

			<div class="carousel-wrapper">
				<div class="carousel">
					<div class="carousell__button--prev">prev</div>
					<div class="images">
						<img
							src="https://images.unsplash.com/vector-1743513994153-5a494fd9e8d9?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxpbGx1c3RyYXRpb25zLWZlZWR8OXx8fGVufDB8fHx8fA%3D%3D"
							alt=""
							class="carousel__photo initial"
						/>
						<img
							src="https://plus.unsplash.com/premium_vector-1747189636799-a6723d6b668a?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxpbGx1c3RyYXRpb25zLWZlZWR8MjF8fHxlbnwwfHx8fHw%3D"
							alt=""
							class="carousel__photo"
						/>
						<img
							src="https://images.unsplash.com/vector-1743170075468-f770f1d0e7c4?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxpbGx1c3RyYXRpb25zLWZlZWR8MzZ8fHxlbnwwfHx8fHw%3D"
							alt=""
							class="carousel__photo"
						/>
					</div>

					<div class="carousell__button--next">next</div>
				</div>
			</div>
			<div class="image-nav"></div>
		</div>
	</body>
</html>
